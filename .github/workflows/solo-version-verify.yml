name: Solo version verify

on:
  push:
    branches:
      - fix/solo-eng-ops-review

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solo-eng-ops-review
      - name: Apply version synchronization
        run: python3 tools/bump-solo-review-version.py
      - name: Syntax and checksum
        run: |
          python3 -m py_compile acme_cli.py acme_runtime.py tests/review_v110.py tests/flow_matrix.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('acme_cli.py').read_text(), feature_version=(3, 6))
          ast.parse(Path('acme_runtime.py').read_text(), feature_version=(3, 6))
          PY
          bash -n acme
          bash -n install.sh
          sha256sum -c SHA256SUMS
      - name: Focused diagnostics regression
        run: python3 -S tests/run_all.py --suite review_issue_diagnostics --report-dir test-results-focused
      - name: Full offline regression
        run: |
          sudo install -d -m 755 /usr/local/lib/acme
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/acme
          python3 -S tests/run_all.py --report-dir test-results
      - name: Print logs on failure
        if: failure() && hashFiles('test-results/*.log') != ''
        run: |
          for f in test-results/*.log; do echo "===== $f ====="; cat "$f"; done
      - name: Commit verified version files
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add acme_cli.py tests/flow_matrix.py tests/review_v110.py CHANGELOG.md SHA256SUMS
          git commit -m "chore: release ACME Helper 1.11.1"
          git push origin HEAD:fix/solo-eng-ops-review