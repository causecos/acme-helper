name: Recompute changelog checksum

on:
  push:
    branches:
      - fix/bilingual-changelog
    paths:
      - .github/workflows/recompute-changelog-checksum.yml

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bilingual-changelog
      - name: Recompute manifest entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('SHA256SUMS')
          lines = []
          for raw in manifest.read_text().splitlines():
              _, sep, rel = raw.partition('  ')
              if not sep:
                  raise SystemExit('invalid manifest line: ' + raw)
              path = Path(rel[2:] if rel.startswith('./') else rel)
              if not path.is_file():
                  raise SystemExit('manifest path missing: ' + rel)
              lines.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + rel)
          manifest.write_text('\n'.join(lines) + '\n')
          PY
          sha256sum -c SHA256SUMS
      - name: Commit checksum
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SHA256SUMS
          git diff --cached --quiet || git commit -m "chore: sync bilingual changelog checksum"
          git push origin HEAD:fix/bilingual-changelog
