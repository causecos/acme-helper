name: Apply and verify multi-domain certificate mode

on:
  push:
    branches:
      - fix/multi-domain-cert-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-domain-cert-mode
      - name: Repair embedded test quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-cert-mode-fix.py')
          text = path.read_text()
          old_open = "        wrapper.write_text(r'''#!/usr/bin/env bash"
          new_open = '        wrapper.write_text(r"""#!/usr/bin/env bash'
          old_close = "exec \"${REAL_MOCK}\" \"${args[@]}\"\n''')\n        wrapper.chmod(0o755)"
          new_close = 'exec "${REAL_MOCK}" "${args[@]}"\n""")\n        wrapper.chmod(0o755)'
          if text.count(old_open) != 1 or text.count(old_close) != 1:
              raise SystemExit('embedded test quoting anchors changed')
          path.write_text(text.replace(old_open, new_open, 1).replace(old_close, new_close, 1))
          PY
          python3 -m py_compile tools/apply-cert-mode-fix.py
      - name: Apply deterministic patch
        run: python3 tools/apply-cert-mode-fix.py
      - name: Syntax and manifest
        run: |
          python3 -m py_compile acme_cli.py acme_runtime.py tests/review_cert_modes.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('acme_cli.py').read_text(), feature_version=(3, 6))
          ast.parse(Path('acme_runtime.py').read_text(), feature_version=(3, 6))
          PY
          sha256sum -c SHA256SUMS
      - name: Focused multi-domain regression
        run: python3 -S tests/run_all.py --suite review_cert_modes --report-dir test-results-focused
      - name: Full offline regression
        run: |
          sudo install -d -m 755 /usr/local/lib/acme
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/acme
          python3 -S tests/run_all.py --report-dir test-results
      - name: Commit only after all gates pass
        run: |
          git rm tools/apply-cert-mode-fix.py .github/workflows/apply-cert-mode-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add acme_cli.py locales/en.json locales/zh-TW.json tests/review_v19.py tests/flow_matrix.py tests/review_cert_modes.py tests/run_all.py README.md README.en.md FEATURE_COVERAGE.md .github/workflows/offline-regression.yml SHA256SUMS
          git commit -m "feat: choose merged or separate certificates for multiple domains"
          git push origin HEAD:fix/multi-domain-cert-mode
