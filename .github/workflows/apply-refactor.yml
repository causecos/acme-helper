name: Apply issuance and docs refactor

on:
  push:
    branches:
      - refactor/issuance-docs-versioning

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issuance-docs-versioning
      - name: Apply refactor
        run: python3 tools/apply-issuance-doc-refactor.py
      - name: Align legacy regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('tests/review_v110.py')
          text = p.read_text()
          old = "'helper_version=1.10.1' in text"
          new = "'helper_version=1.11.0' in text"
          if text.count(old) != 1:
              raise SystemExit('review_v110 version assertion anchor changed')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/review_v19.py')
          text = p.read_text()
          text = text.replace("'acme quick' in p.stderr and 'acme certs' in p.stderr", "'acme issue' in p.stderr and 'acme certs' in p.stderr")
          text = text.replace("'catalog unavailable' in p.stderr and 'acme quick' in p.stderr", "'catalog unavailable' in p.stderr and 'acme issue' in p.stderr")

          old = '''            def quick_cancel(s):
                s.expect(ui('Domains, separated by spaces')).line('cancel.test')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('')
                s.expect(ui('Configure this DNS provider now?')).line('n')
                s.expect(ui('Start issuing this certificate?')).line('n')
            clear(e)
            pty_check(t,'quick-cancel-'+lang,['quick'],e,quick_cancel,lambda rc,out:rc==0 and '--issue' not in argv(e) and ui('CLI shortcut for next time:') in out and ('acme issue --server letsencrypt --keylength ec-256 --dns dns_namesilo --dnssleep 120 --output-layout minimal --output-root ' + e['ACME_OUTPUT_ROOT'] + ' --cert-name cancel.test cancel.test') in out)
            def quick_ok(s):
                s.expect(ui('Domains, separated by spaces')).line('quick.test *.quick.test')
                s.expect(ui('Certificate mode')).expect(chooser).line('separate')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('/namesilo')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('1')
                s.expect(ui('Configure this DNS provider now?')).line('y')
                s.expect('Namesilo_Key').line('PTY-HIDDEN-KEY')
                s.expect(ui('Start issuing {} separate certificates?').format(2)).line('y')
            clear(e);Path(e['ACME_ACCOUNT_CONF']).write_text("SAVED_Namesilo_Key=''\n")
            pty_check(t,'quick-search-config-issue-'+lang,['quick'],e,quick_ok,lambda rc,out:rc==0 and 'PTY-HIDDEN-KEY' not in out and '--issue' in argv(e) and '*.quick.test' in argv(e) and ui('CLI shortcut for next time:') in out and ("acme issue --server letsencrypt --keylength ec-256 --cert-mode separate --dns dns_namesilo --dnssleep 120 --output-layout minimal --output-root " + e['ACME_OUTPUT_ROOT'] + " 'quick.test *.quick.test'") in out)
'''
          new = '''            def quick_cancel(s):
                s.expect(ui('Domains')).line('cancel.test')
                s.expect(ui('ACME Server')).line('')
                s.expect(ui('Validation mode')).line('')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('')
                s.expect(ui('Configure this DNS provider now?')).line('n')
                s.expect(ui('DNS wait in seconds')).line('')
                s.expect(ui('Key length')).line('')
                s.expect(ui('Output layout')).line('')
                s.expect(ui('Output root directory')).line('')
                s.expect(ui('Certificate directory name')).line('')
                s.expect(ui('Reload command (optional): ')).line('')
                s.expect(ui('Add other upstream parameters?')).line('n')
                s.expect(ui('Start issuing the certificate?')).line('n')
            clear(e)
            pty_check(t,'quick-alias-cancel-'+lang,['quick'],e,quick_cancel,lambda rc,out:rc==0 and '--issue' not in argv(e) and ui('CLI shortcut for next time:') in out and ('acme issue --server letsencrypt --keylength ec-256 --dns dns_namesilo --dnssleep 120 --output-layout minimal --output-root ' + e['ACME_OUTPUT_ROOT'] + ' --cert-name cancel.test cancel.test') in out)
            def quick_ok(s):
                s.expect(ui('Domains')).line('quick.test *.quick.test')
                s.expect(ui('Certificate mode')).expect(chooser).line('separate')
                s.expect(ui('ACME Server')).line('')
                s.expect(ui('Validation mode')).line('')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('/namesilo')
                s.expect(ui('DNS API (Enter=default, ?=browse, /term=search)')).line('1')
                s.expect(ui('Configure this DNS provider now?')).line('y')
                s.expect('Namesilo_Key').line('PTY-HIDDEN-KEY')
                s.expect(ui('DNS wait in seconds')).line('')
                s.expect(ui('Key length')).line('')
                s.expect(ui('Output layout')).line('')
                s.expect(ui('Output root directory')).line('')
                s.expect(ui('Certificate group directory name')).line('production')
                s.expect(ui('Reload command (optional): ')).line('')
                s.expect(ui('Add other upstream parameters?')).line('n')
                s.expect(ui('Start issuing {} separate certificates?').format(2)).line('y')
            clear(e);Path(e['ACME_ACCOUNT_CONF']).write_text("SAVED_Namesilo_Key=''\n")
            pty_check(t,'quick-alias-config-issue-'+lang,['quick'],e,quick_ok,lambda rc,out:rc==0 and 'PTY-HIDDEN-KEY' not in out and '--issue' in argv(e) and '*.quick.test' in argv(e) and ui('CLI shortcut for next time:') in out and ("acme issue --server letsencrypt --keylength ec-256 --cert-mode separate --dns dns_namesilo --dnssleep 120 --output-layout minimal --output-root " + e['ACME_OUTPUT_ROOT'] + " --cert-name production 'quick.test *.quick.test'") in out)
'''
          if text.count(old) != 1:
              raise SystemExit('review_v19 quick alias block anchor changed')
          text = text.replace(old, new, 1)
          p.write_text(text)

          manifest = Path('SHA256SUMS')
          lines = manifest.read_text().splitlines()
          for rel in ('./tests/review_v19.py', './tests/review_v110.py'):
              target = Path(rel[2:])
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              matches = [i for i, line in enumerate(lines) if line.endswith('  ' + rel)]
              if len(matches) != 1:
                  raise SystemExit('checksum anchor changed: ' + rel)
              lines[matches[0]] = digest + '  ' + rel
          manifest.write_text('\n'.join(lines) + '\n')
          PY
      - name: Syntax and checksum gate
        run: |
          python3 -m py_compile acme_cli.py acme_runtime.py tests/review_cert_modes.py tests/review_v110.py tests/review_v19.py tests/flow_matrix.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('acme_cli.py').read_text(), feature_version=(3, 6))
          ast.parse(Path('acme_runtime.py').read_text(), feature_version=(3, 6))
          PY
          sha256sum -c SHA256SUMS
      - name: Focused issuance regression
        run: python3 -S tests/run_all.py --suite review_cert_modes --report-dir test-results-focused
      - name: Full offline regression
        run: |
          sudo install -d -m 755 /usr/local/lib/acme
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/acme
          python3 -S tests/run_all.py --report-dir test-results
      - name: Print logs on failure
        if: failure() && hashFiles('test-results/*.log') != ''
        run: |
          for file in test-results/*.log; do
            echo "===== $file ====="
            cat "$file"
          done
      - name: Commit verified product files
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add acme_cli.py install.sh locales/en.json locales/zh-TW.json tests/review_cert_modes.py tests/review_v110.py tests/review_v19.py tests/flow_matrix.py README.md README.en.md FEATURE_COVERAGE.md CHANGELOG.md docs/USAGE.md docs/USAGE.en.md docs/VERSIONING.md SHA256SUMS
          git commit -m "refactor: unify issuance workflow and project docs"
          git push origin HEAD:refactor/issuance-docs-versioning